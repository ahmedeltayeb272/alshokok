<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الشكك الإلكتروني - GitHub Edition</title>
    <!-- مكتبة PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- مكتبة Excel SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #1e293b;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --debt-green: #10b981;
            --debt-blue: #3b82f6;
            --debt-yellow: #f59e0b;
            --debt-red: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; }

        .sidebar { width: 80px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; align-items: center; padding: 20px 0; position: fixed; height: 100vh; right: 0; top: 0; z-index: 100; }
        .sidebar-brand { color: var(--primary); font-size: 24px; margin-bottom: 30px; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; }

        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 20px; width: 50px; height: 50px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .nav-btn:hover, .nav-btn.active { background-color: rgba(255, 255, 255, 0.1); color: #ffffff; }

        .main-wrapper { margin-right: 80px; flex: 1; padding: 30px; max-width: 1200px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }

        .theme-toggle, .excel-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: var(--shadow-sm); }
        .excel-btn-success { background-color: var(--success); color: white; border: none; }

        .search-container { position: relative; margin-bottom: 25px; }
        .search-container i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar { width: 100%; padding: 14px 45px 14px 15px; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); outline: none; }

        .btn { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-purple { background-color: var(--purple); color: #fff; }
        .btn-secondary { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }

        .customers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .customer-card { background-color: var(--bg-card); border-radius: 14px; padding: 20px; cursor: pointer; border: 1px solid var(--border-color); position: relative; }
        .customer-card::before { content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%; }
        .card-green::before { background-color: var(--debt-green); }
        .card-blue::before { background-color: var(--debt-blue); }
        .card-yellow::before { background-color: var(--debt-yellow); }
        .card-red::before { background-color: var(--debt-red); }

        .card-box { background-color: var(--bg-card); border-radius: 16px; padding: 25px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border-color); }

        .total-banner { background: linear-gradient(135deg, var(--primary), var(--purple)); color: white; border-radius: 12px; padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--bg-card); color: var(--text-main); }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 60px; bottom: 0; top: auto; flex-direction: row; justify-content: space-around; padding: 0; }
            .sidebar-brand { display: none; }
            .main-wrapper { margin-right: 0; padding: 15px; margin-bottom: 70px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-store"></i></div>
        <div class="sidebar-menu">
            <button class="nav-btn active" title="الرئيسية" onclick="showView('main-view', this)"><i class="fa-solid fa-house"></i></button>
            <button class="nav-btn" title="إضافة زبون" onclick="showView('add-customer-view', this)"><i class="fa-solid fa-user-plus"></i></button>
            <button class="nav-btn" title="الإحصائيات" onclick="showStats(this)"><i class="fa-solid fa-chart-pie"></i></button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="top-bar">
            <h1>دفتر الشكك الإلكتروني</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="excel-btn excel-btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> تحميل شيت Excel</button>
                <button class="excel-btn" onclick="document.getElementById('excel-input').click()"><i class="fa-solid fa-file-import"></i> رفع Excel جديد</button>
                <input type="file" id="excel-input" class="hidden" accept=".xlsx, .xls" onchange="importFromExcel(event)">
                <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
            </div>
        </div>

        <!-- الرئيسية -->
        <div id="main-view">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-bar" placeholder="ابحث باسم الزبون..." oninput="renderCustomers()">
            </div>
            <div id="customers-container" class="customers-grid"></div>
        </div>

        <!-- إضافة زبون -->
        <div id="add-customer-view" class="hidden">
            <div class="card-box">
                <h2>إضافة زبون جديد</h2>
                <div class="form-group">
                    <label>الاسم الرباعي:</label>
                    <input type="text" id="cust-name" placeholder="اسم الزبون الكامل">
                </div>
                <div class="form-group">
                    <label>ملاحظات:</label>
                    <textarea id="cust-notes" rows="3" placeholder="رقم الهاتف أو المكان..."></textarea>
                </div>
                <div class="form-group">
                    <label>قيمة الشكك الأولية:</label>
                    <input type="number" id="cust-initial-amount" value="0">
                </div>
                <div class="form-group">
                    <label>البيان:</label>
                    <input type="text" id="cust-initial-type" placeholder="نوع البضاعة...">
                </div>
                <button class="btn btn-primary" onclick="saveCustomer()"><i class="fa-solid fa-floppy-disk"></i> حفظ البيانات</button>
            </div>
        </div>

        <!-- تفاصيل الزبون -->
        <div id="customer-details-view" class="hidden">
            <div class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <h2 id="det-cust-name" style="margin:0;"></h2>
                        <p id="det-cust-notes" style="color: var(--text-muted); margin: 5px 0 0 0;"></p>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-danger" onclick="deleteCurrentCustomer()"><i class="fa-solid fa-trash"></i> حذف</button>
                        <button class="btn btn-secondary" onclick="showView('main-view')"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
                    </div>
                </div>

                <div style="margin: 20px 0; display: flex; gap: 10px;">
                    <button class="btn btn-success" onclick="addTransactionPrompt('شكك')"><i class="fa-solid fa-plus"></i> إضافة شكك</button>
                    <button class="btn btn-danger" onclick="addTransactionPrompt('تسديد')"><i class="fa-solid fa-minus"></i> تسديد مبلغ</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>المبلغ</th>
                            <th>البيان</th>
                            <th>التاريخ</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body"></tbody>
                </table>

                <div class="total-banner">
                    <span>إجمالي المتبقي:</span>
                    <span><span id="det-cust-total">0</span> جنيه</span>
                </div>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div id="stats-view" class="hidden">
            <div id="stats-content"></div>
        </div>
    </div>

    <script>
        let customers = [];
        let currentCustomerId = null;

        // تحميل البيانات أولاً من LocalStorage، وإن لم توجد يُحمل من ملف data.json
        async function loadInitialData() {
            const localData = localStorage.getItem('github_shokok_data');
            if (localData) {
                customers = JSON.parse(localData);
                renderCustomers();
            } else {
                try {
                    const res = await fetch('./data.json');
                    if (res.ok) {
                        customers = await res.json();
                        saveLocal();
                        renderCustomers();
                    }
                } catch (err) {
                    console.log('لم يتم العثور على data.json أولي');
                }
            }
        }

        function saveLocal() {
            localStorage.setItem('github_shokok_data', JSON.stringify(customers));
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function showView(viewId, btnElem = null) {
            ['main-view', 'add-customer-view', 'customer-details-view', 'stats-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'main-view') renderCustomers();
        }

        function renderCustomers() {
            const grid = document.getElementById('customers-container');
            const query = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = customers.filter(c => c.name && c.name.toLowerCase().includes(query));

            filtered.forEach(c => {
                const total = (c.transactions || []).reduce((acc, t) => acc + t.amount, 0);
                const card = document.createElement('div');
                card.className = `customer-card card-blue`;
                card.onclick = () => openCustomerDetails(c.id);
                card.innerHTML = `<h3>${c.name}</h3><div><b>${total}</b> جنيه</div>`;
                grid.appendChild(card);
            });
        }

        function saveCustomer() {
            const name = document.getElementById('cust-name').value;
            const notes = document.getElementById('cust-notes').value;
            const amount = parseFloat(document.getElementById('cust-initial-amount').value) || 0;
            const type = document.getElementById('cust-initial-type').value || 'حساب أول الوقت';

            if (!name) return alert('أدخل اسم الزبون');

            const newCust = {
                id: Date.now(),
                name: name,
                notes: notes,
                transactions: amount > 0 ? [{
                    id: Date.now() + 1,
                    amount: amount,
                    type: type,
                    date: new Date().toLocaleDateString('ar-EG')
                }] : []
            };

            customers.push(newCust);
            saveLocal();
            showView('main-view');
        }

        function openCustomerDetails(id) {
            currentCustomerId = id;
            const cust = customers.find(c => c.id == id);
            if (!cust) return;

            document.getElementById('det-cust-name').innerText = cust.name;
            document.getElementById('det-cust-notes').innerText = cust.notes || '';

            const tbody = document.getElementById('transactions-body');
            tbody.innerHTML = '';
            let total = 0;

            (cust.transactions || []).forEach(t => {
                total += t.amount;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${t.amount} جنيه</td>
                    <td>${t.type}</td>
                    <td>${t.date}</td>
                    <td><button class="btn btn-danger" onclick="deleteTransaction(${t.id})">حذف</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('det-cust-total').innerText = total;
            showView('customer-details-view');
        }

        function addTransactionPrompt(mode) {
            const amountStr = prompt(mode === 'شكك' ? 'أدخل المبلغ:' : 'أدخل المسدد:');
            if (!amountStr) return;
            let amount = parseFloat(amountStr);
            if (isNaN(amount)) return;

            if (mode === 'تسديد') amount = -Math.abs(amount);
            const type = prompt('البيان:', mode === 'تسديد' ? 'تسديد' : 'بضاعة');

            const cust = customers.find(c => c.id == currentCustomerId);
            cust.transactions.push({
                id: Date.now(),
                amount: amount,
                type: type,
                date: new Date().toLocaleDateString('ar-EG')
            });

            saveLocal();
            openCustomerDetails(currentCustomerId);
        }

        function deleteTransaction(transId) {
            const cust = customers.find(c => c.id == currentCustomerId);
            cust.transactions = cust.transactions.filter(t => t.id !== transId);
            saveLocal();
            openCustomerDetails(currentCustomerId);
        }

        function deleteCurrentCustomer() {
            if (confirm('حذف هذا الزبون؟')) {
                customers = customers.filter(c => c.id != currentCustomerId);
                saveLocal();
                showView('main-view');
            }
        }

        // ==========================================
        // 📊 تصدير وإسترجاع ملفات EXCEL
        // ==========================================
        function exportToExcel() {
            const excelData = [];
            customers.forEach(c => {
                const total = (c.transactions || []).reduce((acc, t) => acc + t.amount, 0);
                if ((c.transactions || []).length === 0) {
                    excelData.push({
                        "اسم الزبون": c.name,
                        "الملاحظات": c.notes || '',
                        "بيان المعاملة": 'لا يوجد',
                        "مبلغ المعاملة": 0,
                        "التاريخ": '-',
                        "إجمالي المديونية الحالية": total
                    });
                } else {
                    c.transactions.forEach(t => {
                        excelData.push({
                            "اسم الزبون": c.name,
                            "الملاحظات": c.notes || '',
                            "بيان المعاملة": t.type,
                            "مبلغ المعاملة": t.amount,
                            "التاريخ": t.date,
                            "إجمالي المديونية الحالية": total
                        });
                    });
                }
            });

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الشكك");
            XLSX.writeFile(workbook, `بيانات_الشكك_${new Date().toLocaleDateString('ar-EG')}.xlsx`);
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet);

                const restored = {};
                json.forEach(row => {
                    const name = row["اسم الزبون"];
                    if (!name) return;
                    if (!restored[name]) {
                        restored[name] = { id: Date.now() + Math.random(), name: name, notes: row["الملاحظات"] || '', transactions: [] };
                    }
                    if (row["بيان المعاملة"] && row["بيان المعاملة"] !== 'لا يوجد') {
                        restored[name].transactions.push({
                            id: Date.now() + Math.random(),
                            amount: parseFloat(row["مبلغ المعاملة"]) || 0,
                            type: row["بيان المعاملة"],
                            date: row["التاريخ"] || '-'
                        });
                    }
                });

                customers = Object.values(restored);
                saveLocal();
                renderCustomers();
                alert('تم تحميل بيانات Excel بنجاح!');
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = loadInitialData;
    </script>
</body>
</html>
